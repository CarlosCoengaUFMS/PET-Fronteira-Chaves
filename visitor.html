<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Torneio de Robótica</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
        }

        body {
            background: #0b1120;
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--accent-blue);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            margin: 0;
        }

        p {
            color: #94a3b8;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Bracket Viewer */
        .bracket-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: stretch;
            min-width: max-content;
            padding: 20px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 30px;
            width: 250px;
        }

        .round-title {
            text-align: center;
            color: var(--accent-blue);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-size: 14px;
            background: var(--panel-bg);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .match-card {
            background: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .team {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin: 5px 0;
            font-weight: 700;
            border: 1px solid #1e293b;
            font-size: 14px;
            color: #cbd5e1;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .team.winner {
            background: #14532d;
            border-color: #22c55e;
            color: #fff;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }

        .team.winner::after {
            content: "👑";
            margin-left: 8px;
        }

        .team.loser {
            opacity: 0.3;
            text-decoration: line-through;
        }

        .vs {
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            margin: 5px 0;
        }

        .info-text {
            text-align: center;
            color: #64748b;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <header>
        <h1>🏆 Chaveamento Oficial</h1>
        <p>Acompanhe os confrontos em tempo real</p>
    </header>

    <div class="bracket-container" id="visitorBracket">
        <!-- O JS construirá a árvore aqui com base no JSON do Supabase -->
        <h3 class="info-text">Aguardando definição da chave pelo administrador...</h3>
    </div>

    <script>
        // O código Supabase iria aqui, subscrevendo o canal 'tournament_data'
        // Ao receber payload.new, a interface iteraria sobre as rodadas desenhando a árvore

        // Exemplo visual (placeholder) se receber dados
        function renderPlaceholder() {
            document.getElementById('visitorBracket').innerHTML = `
                <div class="round">
                    <div class="round-title">Rodada 1</div>
                    <div class="match-card">
                        <div class="team winner">Escola Alpha</div>
                        <div class="vs">VS</div>
                        <div class="team loser">Escola Beta</div>
                    </div>
                     <div class="match-card">
                        <div class="team">Escola Charlie</div>
                        <div class="vs">VS</div>
                        <div class="team">Escola Delta</div>
                    </div>
                </div>
                <div class="round">
                    <div class="round-title">Final</div>
                    <div class="match-card" style="border-color:#f59e0b;">
                        <div class="team">Escola Alpha</div>
                        <div class="vs">VS</div>
                        <div class="team" style="color:transparent;">TBD</div>
                    </div>
                </div>
            `;
        }

        // Para testar o visual de imediato
        setTimeout(renderPlaceholder, 1000);
    </script>
</body>

</html>
