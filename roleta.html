<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de Sorteio</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js" defer></script>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --accent: #f59e0b;
            --text: #f8fafc;
        }

        body {
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.2);
            transition: transform 0.1s ease-out;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.5));
        }

        .controls {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .spin-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #d97706, #f59e0b);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.4);
            transition: all 0.2s;
            color: black;
        }

        .spin-btn:hover {
            transform: scale(1.02);
        }

        .spin-btn:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 100;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .modal h2 {
            color: var(--accent);
            font-size: 32px;
            margin: 0 0 20px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-blue {
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎰 Sorteador</h1>
        <a href="admin.html" style="color:#38bdf8; text-decoration:none; font-weight:bold;">Voltar ao Admin</a>
    </header>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <div class="controls">
        <textarea id="items" placeholder="Cole os nomes das escolas aqui..." oninput="draw()"></textarea>
        <button class="spin-btn" onclick="spin()">GIRAR ROLETA</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="winner">Vencedor</h2>
            <div class="action-btns">
                <button class="btn-blue" onclick="document.getElementById('modal').classList.remove('active')">Apenas
                    Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const colors = ['#2563eb', '#16a34a', '#dc2626', '#f59e0b', '#9333ea', '#0284c7'];

        let startAngle = 0;
        let isSpinning = false;

        function getItems() {
            return document.getElementById('items').value.split('\n').filter(i => i.trim());
        }

        function draw() {
            const items = getItems();
            ctx.clearRect(0, 0, 600, 600);
            if (items.length === 0) return;

            const arc = Math.PI * 2 / items.length;

            for (let i = 0; i < items.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 290, angle, angle + arc);
                ctx.fill();

                ctx.save();
                ctx.translate(300 + Math.cos(angle + arc / 2) * 180, 300 + Math.sin(angle + arc / 2) * 180);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(items[i].length > 15 ? items[i].substring(0, 13) + '...' : items[i], 0, 0);
                ctx.restore();
            }
        }

        function spin() {
            const items = getItems();
            if (isSpinning || items.length < 2) return;
            isSpinning = true;

            const totalTime = 4000 + Math.random() * 2000;
            const targetAngle = startAngle + (Math.PI * 2 * 10) + Math.random() * Math.PI * 2;
            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = timestamp - startTime;

                if (progress < totalTime) {
                    const easeOut = 1 - Math.pow(1 - progress / totalTime, 3);
                    startAngle = targetAngle * easeOut;
                    draw();
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    const finalAngle = (startAngle % (Math.PI * 2));
                    const arc = Math.PI * 2 / items.length;
                    const index = Math.floor((Math.PI * 2 - (finalAngle + Math.PI / 2) % (Math.PI * 2)) / arc) % items.length;

                    document.getElementById('winner').innerText = items[index];
                    document.getElementById('modal').classList.add('active');
                    confetti({ particleCount: 150, spread: 80 });

                    // Remove da lista
                    items.splice(index, 1);
                    document.getElementById('items').value = items.join('\n');
                }
            }
            requestAnimationFrame(animate);
        }

        document.getElementById('items').value = "Escola A\nEscola B\nEscola C\nEscola D";
        draw();
    </script>
</body>

</html>
