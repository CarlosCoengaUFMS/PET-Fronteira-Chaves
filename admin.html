<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Torneio de Robótica</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-dark);
            margin: 0;
            padding: 20px;
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: 22px;
            margin: 0;
            color: var(--accent-blue);
        }

        /* Sistema de Abas (Tabs) */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: #0f172a;
            color: #94a3b8;
            transition: all 0.3s;
            font-size: 15px;
            border: 1px solid var(--border-color);
        }

        .tab-btn.active.sumo {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .tab-btn.active.cabo {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Área de Setup (Listas) */
        .setup-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .info-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .badge {
            background: #334155;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: #0f172a;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent-blue);
        }

        /* Botões de Ação */
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .btn-fill {
            background: #2563eb;
        }

        .btn-fill:hover {
            background: #1d4ed8;
        }

        .btn-shuffle {
            background: #8b5cf6;
        }

        .btn-shuffle:hover {
            background: #7c3aed;
        }

        .btn-clear {
            background: #dc2626;
        }

        .btn-clear:hover {
            background: #b91c1c;
        }

        /* Seu estilo original da chave pode ficar aqui */
        .bracket-wrapper {
            margin-top: 30px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
        }

        .team-input input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
            color: #000;
            margin: 5px;
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">
            <h1>⚙️ Admin - Organização de Modalidades</h1>
        </div>
    </header>

    <!-- Controles de Abas -->
    <div class="tabs">
        <button class="tab-btn active sumo" onclick="switchTab('sumo', this)">🥋 Sumô de Robôs</button>
        <button class="tab-btn cabo" onclick="switchTab('cabo', this)">🪢 Cabo de Guerra</button>
    </div>

    <!-- ABA: SUMÔ -->
    <div id="sumo" class="tab-content active setup-container">
        <div class="info-header">
            <h2>Lista de Escolas - Sumô</h2>
            <span class="badge" id="count-sumo">0 cadastradas</span>
        </div>
        <textarea id="list-sumo"
            placeholder="Exemplos de como preencher:&#10;E.E. Machado de Assis&#10;Colégio Objetivo&#10;Sesi Robótica&#10;Equipe Trovão Azul&#10;(Coloque apenas um nome por linha)"
            oninput="updateList('sumo')"></textarea>

        <div class="action-bar">
            <button class="btn btn-shuffle" onclick="shuffleList('sumo')">🎲 Embaralhar Lista</button>
            <button class="btn btn-fill" onclick="fillBracket('sumo')">✏️ Preencher Chave com Sumô</button>
            <button class="btn btn-clear" onclick="clearList('sumo')">🗑️ Limpar</button>
        </div>
    </div>

    <!-- ABA: CABO DE GUERRA -->
    <div id="cabo" class="tab-content setup-container">
        <div class="info-header">
            <h2>Lista de Escolas - Cabo de Guerra</h2>
            <span class="badge" id="count-cabo">0 cadastradas</span>
        </div>
        <textarea id="list-cabo"
            placeholder="Exemplos de como preencher:&#10;E.E. Albert Einstein&#10;IFMS Câmpus Central&#10;Equipe Força Bruta&#10;(Coloque apenas um nome por linha)"
            oninput="updateList('cabo')"></textarea>

        <div class="action-bar">
            <button class="btn btn-shuffle" onclick="shuffleList('cabo')">🎲 Embaralhar Lista</button>
            <button class="btn btn-fill" onclick="fillBracket('cabo')">✏️ Preencher Chave com Cabo de Guerra</button>
            <button class="btn btn-clear" onclick="clearList('cabo')">🗑️ Limpar</button>
        </div>
    </div>

    <!--========================================================
        COLE O SEU CÓDIGO HTML DO CHAVEAMENTO EXATAMENTE AQUI 
    =========================================================-->
    <div class="bracket-wrapper" id="chaveamento-area">
        <h3>Área da Chave Atual</h3>
        <p style="color: #94a3b8; font-size: 14px;">(Abaixo está um exemplo genérico, substitua pelo seu HTML original)
        </p>

        <!-- EXEMPLO DE INPUTS (Certifique-se de que seus inputs originais tenham a classe .team-input input) -->
        <div class="team-input"><input type="text" placeholder="Equipe 1"></div>
        <div class="team-input"><input type="text" placeholder="Equipe 2"></div>
        <div class="team-input"><input type="text" placeholder="Equipe 3"></div>
        <div class="team-input"><input type="text" placeholder="Equipe 4"></div>
    </div>
    <!--========================================================-->

    <script>
        // 1. CARREGAR DADOS SALVOS AO ABRIR A PÁGINA (Prevenção de perda de dados)
        window.onload = () => {
            if (localStorage.getItem('listaSumo')) {
                document.getElementById('list-sumo').value = localStorage.getItem('listaSumo');
                updateCount('sumo');
            }
            if (localStorage.getItem('listaCabo')) {
                document.getElementById('list-cabo').value = localStorage.getItem('listaCabo');
                updateCount('cabo');
            }
        };

        // 2. SISTEMA DE ABAS (TABS)
        function switchTab(modalidade, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(modalidade).classList.add('active');
            btnElement.classList.add('active');
        }

        // 3. ATUALIZAR CONTAGEM E SALVAR NO NAVEGADOR
        function updateList(modalidade) {
            const textarea = document.getElementById(`list-${modalidade}`);
            // Salva no localStorage em tempo real
            localStorage.setItem(`lista${modalidade === 'sumo' ? 'Sumo' : 'Cabo'}`, textarea.value);
            updateCount(modalidade);
        }

        function updateCount(modalidade) {
            // Pega o texto, separa por linha e remove linhas vazias (evita contar enter sem querer)
            const escolas = document.getElementById(`list-${modalidade}`).value
                .split('\n')
                .filter(nome => nome.trim() !== '');
            document.getElementById(`count-${modalidade}`).innerText = `${escolas.length} cadastradas`;
            return escolas;
        }

        // 4. EMBARALHAR (SORTEIO JUSTO)
        function shuffleList(modalidade) {
            let escolas = updateCount(modalidade);
            if (escolas.length === 0) return alert('A lista está vazia!');

            // Algoritmo de Fisher-Yates para embaralhar o array perfeitamente
            for (let i = escolas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [escolas[i], escolas[j]] = [escolas[j], escolas[i]];
            }

            // Devolve pra caixa de texto e salva
            document.getElementById(`list-${modalidade}`).value = escolas.join('\n');
            updateList(modalidade);
        }

        // 5. PREENCHER CHAVEAMENTO ORIGINAL
        function fillBracket(modalidade) {
            const escolas = updateCount(modalidade);

            if (escolas.length === 0) {
                alert('Cole as escolas na lista antes de preencher a chave!');
                return;
            }

            // ATENÇÃO: Verifique se no seu HTML as caixinhas de time tem a classe '.team-input input[type="text"]' ou ajuste aqui.
            // Eu selecionei genericamente todos os inputs de texto dentro da área do chaveamento.
            const inputs = document.querySelectorAll('#chaveamento-area input[type="text"]');

            if (inputs.length === 0) {
                alert('Nenhuma caixa de equipe encontrada no HTML do chaveamento. Verifique se colou sua chave corretamente.');
                return;
            }

            // Limpa todas as caixas primeiro
            inputs.forEach(input => input.value = '');

            // Preenche na ordem em que estão (se você usou "Embaralhar" antes, será aleatório!)
            let escolasPreenchidas = 0;
            escolas.forEach((escola, index) => {
                if (inputs[index]) {
                    inputs[index].value = escola;
                    escolasPreenchidas++;
                }
            });

            alert(`Sucesso! ${escolasPreenchidas} escolas foram distribuídas na chave de ${modalidade.toUpperCase()}.`);
        }

        // 6. LIMPAR LISTA
        function clearList(modalidade) {
            if (confirm('Tem certeza que deseja apagar esta lista?')) {
                document.getElementById(`list-${modalidade}`).value = '';
                updateList(modalidade);
            }
        }
    </script>
</body>

</html>
