<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Torneio de Robótica</title>
    <link rel="icon" href="./styles/logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --border-color: rgba(51, 65, 85, 0.8);
        }

        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0b1120 0%, #0f172a 100%); margin: 0; padding: 20px; color: var(--text-light); min-height: 100vh; }
        
        /* Header & Navegação */
        header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            background: var(--panel-bg); backdrop-filter: blur(10px); padding: 15px 25px; 
            border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 25px; gap: 15px;
        }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand img { height: 45px; }
        .brand h1 { font-size: 22px; margin: 0; color: var(--accent-blue); text-shadow: 0 0 15px rgba(56,189,248,0.4); }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; color: white;
        }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 4px 15px rgba(37,99,235,0.4); }
        .btn-success { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 4px 15px rgba(22,163,74,0.4); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 4px 15px rgba(220,38,38,0.4); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Setup Area */
        .setup-container {
            background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 25px; margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .setup-container h2 { margin-top: 0; color: var(--accent-blue); font-size: 18px; display: flex; justify-content: space-between; }
        textarea {
            width: 100%; height: 100px; background: rgba(15,23,42,0.6); color: var(--text-light);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 14px;
            resize: vertical; outline: none; margin-bottom: 15px; transition: border 0.3s;
        }
        textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }

        /* Bracket Dinâmico */
        .bracket-wrapper { overflow-x: auto; padding-bottom: 30px; }
        .bracket { display: flex; gap: 40px; min-width: max-content; align-items: stretch; }
        .round { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; width: 220px; position: relative; }
        
        .round-title {
            text-align: center; font-weight: 800; color: var(--accent-blue); background: var(--panel-bg);
            padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); text-transform: uppercase;
            font-size: 12px; letter-spacing: 1px; margin-bottom: 15px;
        }

        .match {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;
        }
        .match.bye { border-color: var(--accent-gold); background: rgba(245,158,11,0.1); }
        .match-label { font-size: 10px; color: #94a3b8; font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; }
        
        .team-input {
            display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
        }
        .team-input input[type="text"] {
            flex: 1; background: rgba(15,23,42,0.8); border: 1px solid var(--border-color);
            color: white; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; outline: none;
        }
        .team-input input[type="radio"] { cursor: pointer; accent-color: var(--accent-green); width: 18px; height: 18px; }
        .vs { text-align: center; font-size: 10px; color: #64748b; font-weight: bold; margin: 2px 0; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="./styles/logo.png" alt="Logo">
            <h1>⚙️ Gerenciador de Chaves</h1>
        </div>
        <div class="actions">
            <button class="btn btn-success" onclick="saveData()">💾 Salvar</button>
            <a href="roleta.html" target="_blank" class="btn btn-primary">🎰 Roleta</a>
            <a href="visitor.html" target="_blank" class="btn btn-primary">👁️ Telão</a>
            <button class="btn btn-danger" onclick="logout()">Sair</button>
        </div>
    </header>

    <div class="setup-container">
        <h2><span>🏫 Escolas Participantes</span> <span id="schoolCount">0 escolas</span></h2>
        <textarea id="schoolsInput" placeholder="Cole a lista de escolas (uma por linha)..."></textarea>
        <button class="btn btn-primary" onclick="generateBracket()">⚡ Gerar Chaveamento Automático</button>
    </div>

    <div class="bracket-wrapper" id="bracketContainer">
        <!-- O chaveamento será injetado aqui via JS -->
    </div>

    <script>
        let tournamentData = {};

        function generateBracket() {
            const lines = document.getElementById('schoolsInput').value.split('\n').map(s => s.trim()).filter(s => s);
            document.getElementById('schoolCount').textContent = `${lines.length} escolas`;
            
            if (lines.length < 2) return alert("Adicione pelo menos 2 escolas!");

            const container = document.getElementById('bracketContainer');
            container.innerHTML = '';
            
            let currentRoundTeams = [...lines];
            let roundNum = 1;
            const bracket = document.createElement('div');
            bracket.className = 'bracket';

            // Algoritmo de geração dinâmica (Mata-Mata c/ Chapéus)
            while (currentRoundTeams.length > 1) {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.id = `round-${roundNum}`;
                
                const title = document.createElement('div');
                title.className = 'round-title';
                title.textContent = currentRoundTeams.length === 2 ? 'Grande Final' : `Rodada ${roundNum}`;
                roundDiv.appendChild(title);

                const nextRoundTeams = [];
                const numMatches = Math.floor(currentRoundTeams.length / 2);
                const hasBye = currentRoundTeams.length % 2 !== 0;

                for (let i = 0; i < numMatches; i++) {
                    const matchId = `r${roundNum}_m${i+1}`;
                    const t1 = currentRoundTeams[i*2] || '';
                    const t2 = currentRoundTeams[i*2+1] || '';
                    
                    roundDiv.innerHTML += `
                        <div class="match">
                            <span class="match-label">Jogo ${i+1}</span>
                            <div class="team-input">
                                <input type="radio" name="${matchId}" value="t1" onchange="updateAdvancement(this, '${matchId}_t1', 'next_${matchId}')">
                                <input type="text" id="${matchId}_t1" value="${t1}" placeholder="Equipe A">
                            </div>
                            <div class="vs">VS</div>
                            <div class="team-input">
                                <input type="radio" name="${matchId}" value="t2" onchange="updateAdvancement(this, '${matchId}_t2', 'next_${matchId}')">
                                <input type="text" id="${matchId}_t2" value="${t2}" placeholder="Equipe B">
                            </div>
                        </div>
                    `;
                    nextRoundTeams.push(`next_${matchId}`);
                }

                if (hasBye) {
                    const byeTeam = currentRoundTeams[currentRoundTeams.length - 1];
                    roundDiv.innerHTML += `
                        <div class="match bye">
                            <span class="match-label">Chapéu (Avança Direto)</span>
                            <div class="team-input">
                                <input type="text" id="bye_r${roundNum}" value="${byeTeam}" readonly>
                            </div>
                        </div>
                    `;
                    nextRoundTeams.push(`bye_r${roundNum}`);
                }

                bracket.appendChild(roundDiv);
                currentRoundTeams = nextRoundTeams;
                roundNum++;
            }
            
            // Adiciona o vencedor final
            const championDiv = document.createElement('div');
            championDiv.className = 'round';
            championDiv.innerHTML = `
                <div class="round-title" style="color:var(--accent-gold); border-color:var(--accent-gold);">🏆 Campeão</div>
                <div class="match" style="border-color:var(--accent-gold);">
                    <input type="text" id="champion_input" readonly style="color:var(--accent-gold); text-align:center; font-size:16px;">
                </div>
            `;
            bracket.appendChild(championDiv);
            container.appendChild(bracket);
        }

        function updateAdvancement(radio, inputId, nextTarget) {
             const selectedValue = document.getElementById(inputId).value;
             const nextInput = document.getElementById(nextTarget);
             
             // Em um cenário real completo, a lógica procuraria o input do próximo nível.
             // Para a estrutura dinâmica, os IDs 'nextTarget' servem como marcadores para onde o valor deve ir.
             console.log(`Avançando: ${selectedValue} para ${nextTarget}`);
        }

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) window.location.href = 'login.html';
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        async function saveData() {
            // Lógica para capturar o HTML gerado e os valores ou estruturar num JSON robusto
            alert("Salvamento da estrutura dinâmica a ser implementado no backend.");
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
